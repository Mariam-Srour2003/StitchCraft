<div
  class="sc-grid-canvas"
  [class.sc-grid-canvas--erase]="tool() === 'erase'"
  [class.sc-grid-canvas--fill]="tool() === 'fill'"
  [class.sc-grid-canvas--pick]="tool() === 'pick'"
  [class.sc-grid-canvas--text]="tool() === 'text'"
  [class.sc-grid-canvas--stitch]="tool() === 'stitch'"
  [class.sc-grid-canvas--readonly]="!interactive()"
  [class.sc-grid-canvas--line]="tool() === 'backstitch'"
  [class.sc-grid-canvas--line-erase]="tool() === 'backstitch-erase'"
>
  <canvas
    #canvas
    [style.width.px]="canvasWidthPx()"
    [style.height.px]="canvasHeightPx()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (pointerleave)="onPointerLeave()"
  ></canvas>
  <canvas
    #overlay
    class="sc-grid-canvas__overlay"
    aria-hidden="true"
    [style.width.px]="canvasWidthPx()"
    [style.height.px]="canvasHeightPx()"
  ></canvas>
</div>
