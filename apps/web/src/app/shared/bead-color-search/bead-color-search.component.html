<div class="dmc-search">
  <input
    class="dmc-search__input"
    type="search"
    [placeholder]="'Add ' + catalogue().line + ' bead: code or name…'"
    [attr.aria-label]="'Search ' + catalogue().line + ' bead colours to add to the palette'"
    [value]="term()"
    (input)="onTermInput($any($event.target).value)"
  />

  @if (results().length === 0) {
    <p class="dmc-search__status">No {{ catalogue().line }} colours match "{{ term().trim() }}".</p>
  } @else {
    <ul class="dmc-search__results" [attr.aria-label]="catalogue().line + ' bead colours'">
      @for (color of results(); track color.code) {
        <li>
          <button
            type="button"
            class="dmc-search__result"
            [class.dmc-search__result--in-palette]="paletteCodeSet().has(color.code)"
            [attr.aria-label]="
              (paletteCodeSet().has(color.code) ? 'Select ' : 'Add ') +
              catalogue().brand +
              ' ' +
              color.code +
              ' ' +
              color.name
            "
            (click)="select(color)"
          >
            <span class="dmc-search__chip" [style.background]="color.hex"></span>
            <span class="dmc-search__code">{{ color.code }}</span>
            <span class="dmc-search__name">{{ color.name }}</span>
            @if (paletteCodeSet().has(color.code)) {
              <span class="dmc-search__badge">In palette</span>
            } @else if (finishNote(color)) {
              <span class="dmc-search__badge">{{ finishNote(color) }}</span>
            }
          </button>
        </li>
      }
    </ul>
    @if (matches().length > results().length) {
      <p class="dmc-search__status">
        Showing {{ results().length }} of {{ matches().length }}. Type to narrow it down.
      </p>
    }
  }
</div>
