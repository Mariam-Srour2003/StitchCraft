<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1>Create an account</h1>

  <label class="auth-form__field">
    <span>Name</span>
    <input type="text" formControlName="name" autocomplete="name" />
  </label>

  <label class="auth-form__field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" />
  </label>

  <label class="auth-form__field">
    <span>Password</span>
    <input type="password" formControlName="password" autocomplete="new-password" />
  </label>

  @if (error()) {
    <p class="auth-form__error" role="alert">{{ error() }}</p>
  }

  <sc-button type="submit" [disabled]="form.invalid || submitting()">
    {{ submitting() ? 'Creating account…' : 'Create account' }}
  </sc-button>

  <p class="auth-form__switch">Already have an account? <a routerLink="/sign-in">Sign in</a></p>
</form>
