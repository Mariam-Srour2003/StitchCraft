<div class="app-shell">
  <a class="app-shell__skip sc-no-print" href="#main">Skip to content</a>
  <header class="app-shell__header sc-no-print">
    <a class="app-shell__brand" routerLink="/">StitchCraft</a>
    <nav class="app-shell__nav" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="app-shell__link--active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="app-shell__link"
        >{{ link.label }}</a
      >
      }
    </nav>
    <div class="app-shell__account">
      @if (authStore.isAuthenticated()) {
      <a routerLink="/settings" routerLinkActive="app-shell__link--active" class="app-shell__link"
        >Settings</a
      >
      <span class="app-shell__user">{{ authStore.currentUser()?.name }}</span>
      <sc-button variant="ghost" (pressed)="signOut()">Sign out</sc-button>
      } @else {
      <a routerLink="/sign-in" class="app-shell__link">Sign in</a>
      <a routerLink="/register" class="app-shell__link">Create account</a>
      }
    </div>
  </header>

  <main class="app-shell__main" id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
