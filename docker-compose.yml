services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stitchcraft
      POSTGRES_PASSWORD: stitchcraft
      POSTGRES_DB: stitchcraft
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stitchcraft']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stitchcraft:stitchcraft@db:5432/stitchcraft
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      WEB_ORIGIN: http://localhost:8080
      PORT: 3000
      STORAGE_LOCAL_DIR: /workspace/apps/api/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/api/storage
      # Uncomment if also running the optional `ai` profile below:
      # AI_SERVICE_URL: http://ai:8000
    ports:
      - '3000:3000'
    volumes:
      - api-storage:/workspace/apps/api/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

  # Optional AI microservice (background removal, upscale). Not started by
  # `docker compose up` by default - onnxruntime makes for a large image and
  # the whole app works fully without it (see PLAN.md). Bring it up with:
  #   docker compose --profile ai up --build
  # ...and uncomment AI_SERVICE_URL above so `api` actually calls it.
  ai:
    build:
      context: ./services/ai
    profiles: ['ai']
    ports:
      - '8000:8000'

volumes:
  db-data:
  api-storage:
